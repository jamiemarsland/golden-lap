<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #f4efe6; font-family: Inter, sans-serif; }
      .name span, .line span, .url span, .board span, .cap span { display: inline-block; }
      .board { position: absolute; left: 160px; top: 690px; width: 1600px; text-align: center; font-family: 'Archivo Black', sans-serif; font-size: 46px; letter-spacing: .05em; z-index: 4; }
      .board span { background: #f3e6c8; border-radius: 60px; padding: 12px 46px 12px 12px; box-shadow: 8px 8px 0 #b8371f; }
      .board b { display: inline-block; width: 76px; height: 76px; line-height: 76px; border-radius: 50%; background: #e2562b; color: #f3e6c8; font-weight: 400; }
      .board i { font-style: normal; display: inline-block; padding: 0 60px 0 30px; color: #2a1810; }
      .board u { text-decoration: none; display: inline-block; color: #b8371f; }
      .cap { position: absolute; left: 160px; top: 822px; width: 1600px; text-align: center; font-family: 'Oswald', sans-serif; font-size: 30px; letter-spacing: .3em; color: #c9b892; z-index: 4; }
      #card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #1c110b; z-index: 3; }
      #stripes { position: absolute; left: 0; top: 440px; width: 1920px; height: 80px; z-index: 4; }
      #stripes i { position: absolute; left: 0; width: 1920px; height: 16px; transform-origin: 0 50%; }
      .name { position: absolute; left: 60px; top: 150px; width: 1800px; text-align: center; font-family: 'Archivo Black', sans-serif; font-size: 214px; letter-spacing: .01em; color: #f3e6c8; text-shadow: 5px 5px 0 #f0b53a, 10px 10px 0 #e2562b, 15px 15px 0 #b8371f, 20px 20px 0 #5e2414; transform: skewX(-10deg); z-index: 4; }
      .line { position: absolute; left: 160px; top: 566px; width: 1600px; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: 60px; color: #f3e6c8; z-index: 4; }
      .url { position: absolute; left: 160px; top: 916px; width: 1600px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 50px; letter-spacing: .14em; color: #f0b53a; z-index: 4; }
    </style>
  </head>
  <body>
    <!-- Golden Lap "Lights out" trailer. Generated by ../build_trailer.py. No music: opens flat out into the swoop, ends with the engine fading into the distance under the end card. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.0" data-width="1920" data-height="1080">
      <video id="v0" class="clip" src="assets/swoop.mp4" data-has-audio="true" data-volume="1" playsinline data-start="0" data-duration="6.2" data-media-start="4.6" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v1" class="clip" src="assets/tunfast.mp4" data-has-audio="true" data-volume="1" playsinline data-start="6.2" data-duration="1.9" data-media-start="0.15" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v2" class="clip" src="assets/lapgolden.mp4" data-has-audio="true" data-volume="1" playsinline data-start="8.1" data-duration="1.7" data-media-start="19.8" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v3" class="clip" src="assets/laprain.mp4" data-has-audio="true" data-volume="1" playsinline data-start="9.8" data-duration="1.9" data-media-start="9.6" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v4" class="clip" src="assets/lapdusk.mp4" data-has-audio="true" data-volume="1" playsinline data-start="11.7" data-duration="1.7" data-media-start="60.6" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v5" class="clip" src="assets/laphud.mp4" data-has-audio="true" data-volume="1" playsinline data-start="13.4" data-duration="2.6" data-media-start="73.4" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <video id="v6" class="clip" src="assets/lapgolden.mp4" data-has-audio="true" data-volume="1" playsinline data-start="16.0" data-duration="1.7" data-media-start="79.0" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;z-index:1"></video>
      <div id="card" class="clip" data-start="17.7" data-duration="5.3" data-track-index="1"></div>
      <div id="t-name" class="clip name" data-start="18.2" data-duration="4.8" data-track-index="2"><span id="t-name-in">GOLDEN LAP</span></div>
      <div id="t-line" class="clip line" data-start="19.0" data-duration="4.0" data-track-index="2"><span id="t-line-in">One lap. Steered with your bare hands.</span></div>
      <div id="t-board" class="clip board" data-start="19.9" data-duration="3.1" data-track-index="2"><span id="t-board-in"><b>1</b><i>YOUR NAME</i><u>--:--.---</u></span></div>
      <div id="t-cap" class="clip cap" data-start="20.3" data-duration="2.7" data-track-index="2"><span id="t-cap-in">ONE WORLD LEADERBOARD. EVERY LAP COUNTS.</span></div>
      <div id="t-url" class="clip url" data-start="21.0" data-duration="2.0" data-track-index="2"><span id="t-url-in">golden-lap.space.fast</span></div>
      <div id="stripes" class="clip" data-start="18.2" data-duration="4.8" data-track-index="3"><i id="s0" style="top:0px;background:#5e2414"></i><i id="s1" style="top:16px;background:#e2562b"></i><i id="s2" style="top:32px;background:#f0b53a"></i><i id="s3" style="top:48px;background:#f3e6c8"></i><i id="s4" style="top:64px;background:#2f9b96"></i></div>
      <audio id="away" class="clip" src="assets/away.wav" data-start="17.7" data-duration="5.3" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (() => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t-name-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 18.2);
      tl.fromTo("#t-line-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 19.0);
      tl.fromTo("#t-board-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 19.9);
      tl.fromTo("#t-cap-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 20.3);
      tl.fromTo("#t-url-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 21.0);
      tl.fromTo("#s0", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 18.3);
      tl.fromTo("#s1", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 18.37);
      tl.fromTo("#s2", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 18.44);
      tl.fromTo("#s3", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 18.51);
      tl.fromTo("#s4", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 18.580000000000002);
      tl.to({}, { duration: 0.01 }, 22.98);
      window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
